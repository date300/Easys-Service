name: Flutter Build & Deploy (Ultra Fast)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ==========================================
  # ১. ওয়েব বিল্ড
  # ==========================================
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (Shallow Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter (with SDK Cache)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/Easys-Service/"

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ==========================================
  # ২. Android APK বিল্ড (সব ডিভাইসে চলবে)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (Shallow Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java (with Gradle Cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter (with SDK Cache)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-${{ hashFiles('**/pubspec.lock', '**/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK (All Devices)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.jvmargs=-Xmx4g"
        # ✅ সব ডিভাইসে চলবে — arm64, armeabi-v7a, x86_64 সব architecture
        run: flutter build apk --release

      - name: Upload Android APK (No Re-compression)
        uses: actions/upload-artifact@v4
        with:
          name: Easys-Service-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # ==========================================
  # ৩. GitHub Pages Deploy
  # ==========================================
  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
