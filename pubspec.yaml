name: EasyService
description: "A professional service provider app project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  
  # --- Data & Local Storage ---
  http: ^1.2.0
  dio: ^5.7.0
  shared_preferences: ^2.5.4

  # --- UI & Design ---
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  
  # --- Toast/Flushbar - আপডেট করা ---
  another_flushbar: ^1.12.30  # অথবা fluttertoast ব্যবহার করুন
  # অথবা fluttertoast: ^8.2.5 ব্যবহার করুন (আরও stable)

  # --- Architecture & Navigation ---
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  # আপডেট করুন
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/ultra5G.png
    - assets/EasyService.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/EasyService.png"
  min_sdk_android: 21
