name: easyservice
description: "A professional service provider app project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  audioplayers: ^6.1.0
  webview_flutter: ^4.10.0
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  google_mobile_ads: ^5.1.0 
  # --- Data & Local Storage ---
  http: ^1.1.0
  dio: ^5.7.0
  shared_preferences: ^2.5.4

  # --- UI & Design ---
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # --- Architecture & Navigation ---
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0

  # --- Push Notifications (FIXED — Compatible Versions) ---
  firebase_core: ^4.8.0          # v4 required by messaging v16
  firebase_messaging: ^16.0.2     # Latest stable
  flutter_local_notifications: ^19.0.0
  rename: ^3.1.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/ultra5G.png
    - assets/EasyService.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/EasyService.png"
  min_sdk_android: 21
